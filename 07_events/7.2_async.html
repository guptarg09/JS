<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #414141; color: aliceblue;">
    <h2>Chai aur Code</h2>
    <button id="stop">Stop</button>
</body>
<script>
    // setTimeout(function(){
    //     console.log("ritesh")
    // }, 2000)

    const sayRitesh = function(){
        console.log("ritesh")
    }
    setTimeout(sayRitesh, 2000)  // provide only refrence of function

    
    const changeText = function(){
        document.querySelector('h2').innerHTML = "best js series"
    }
    const chaneMe = setTimeout(changeText, 2000)

    // stop text change by click on button
    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(chaneMe)
        console.log('stopped');
    })
</script>
</html>
